name: PR title

# Squash merges use the pull request title as the commit message on main (AGENTS.md, "Commits").
# pull_request_target runs this file from the base branch. That is safe only because that path never
# checks out or runs pull request code and has read-only permissions: keep it that way.
# Pull requests opened by bump.yml with GITHUB_TOKEN do not trigger pull_request_target, so bump.yml
# starts this workflow by workflow_dispatch on its branch. That path checks out the branch (written
# only by bump.yml or someone with write access, since dispatch needs actions: write) and runs
# scripts/pr_title.py, which reads its rules from the `with:` block below.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] read-only token, no checkout on this path, never runs pull request code
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions: {}

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - if: github.event_name == 'pull_request_target'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
          scopes: |
            formula
            ci
            docs
            deps
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: |
            The summary "{subject}" must start with a lower-case letter and must not end with a full stop.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the title of the open pull request from this branch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="$(gh pr list --repo "$REPO" --head "$GITHUB_REF_NAME" --state open --json title --jq '.[0].title // empty')"
          if [ -z "$TITLE" ]; then
            echo "No open pull request from $GITHUB_REF_NAME" >&2
            exit 1
          fi
          TITLE="$TITLE" python3 -I scripts/pr_title.py
