name: PR title

# Squash merges use the pull request title as the commit message on main (AGENTS.md, "Commits").
# pull_request_target runs this file from the base branch. That is safe only because the job never
# checks out or runs pull request code and has read-only permissions: keep it that way.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] read-only token, no checkout, never runs pull request code
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
          scopes: |
            formula
            ci
            docs
            deps
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: |
            The summary "{subject}" must start with a lower-case letter and must not end with a full stop.
